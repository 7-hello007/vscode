<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="dark">
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:#d9dde4;font:12px system-ui,sans-serif}
    #app{display:flex;flex-direction:column;width:100%;height:100%;background:rgba(17,19,24,.72)}
    #toolbar{height:38px;display:flex;align-items:center;gap:8px;padding:0 12px;background:rgba(32,36,43,.78);border-bottom:1px solid #3b424c;box-sizing:border-box}
    button{width:34px;height:27px;border:0;background:transparent;color:#cbd1d9;font-size:16px}button:disabled{opacity:.35}
    #page{min-width:64px;text-align:center;color:#aab2bd}#zoom{min-width:52px;text-align:center;color:#8f99a6}
    #viewport{flex:1;overflow:auto;text-align:center;padding:14px;box-sizing:border-box;background:transparent}
    canvas{display:inline-block;box-shadow:0 2px 12px rgba(0,0,0,.45);background:#fff}
    #status{padding:24px;color:#d59a9a;text-align:center;white-space:pre-wrap}
  </style>
</head>
<body>
<div id="app">
  <div id="toolbar"><button id="prev" aria-label="Previous page">‹</button><span id="page">0 / 0</span><button id="next" aria-label="Next page">›</button><button id="minus">−</button><span id="zoom">100%</span><button id="plus">＋</button></div>
  <div id="viewport"><canvas id="canvas"></canvas><div id="status">Preparing PDF…</div></div>
</div>
<script src="pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='pdf.worker.min.js';
const state={pdf:null,page:1,scale:1,render:null};
const canvas=document.getElementById('canvas'),status=document.getElementById('status'),ctx=canvas.getContext('2d');
async function render(){if(!state.pdf)return; if(state.render)state.render.cancel(); const page=await state.pdf.getPage(state.page); const viewport=page.getViewport({scale:state.scale}); canvas.width=Math.ceil(viewport.width);canvas.height=Math.ceil(viewport.height);canvas.style.width=viewport.width+'px';canvas.style.height=viewport.height+'px';status.style.display='none';canvas.style.display='inline-block';state.render=page.render({canvasContext:ctx,viewport});try{await state.render.promise}catch(e){if(e&&e.name!=='RenderingCancelledException')throw e}document.getElementById('page').textContent=state.page+' / '+state.pdf.numPages;document.getElementById('zoom').textContent=Math.round(state.scale*100)+'%';document.getElementById('prev').disabled=state.page<=1;document.getElementById('next').disabled=state.page>=state.pdf.numPages;}
window.hishPdf={open:async function(url){status.style.display='block';status.textContent='Loading PDF…';canvas.style.display='none';try{state.pdf=await pdfjsLib.getDocument({url:url,disableRange:true,disableStream:true}).promise;state.page=1;state.scale=1;await render()}catch(e){status.textContent='PDF preview failed: '+(e&&e.message?e.message:String(e));}}};
document.getElementById('prev').onclick=()=>{if(state.page>1){state.page--;render()}};document.getElementById('next').onclick=()=>{if(state.pdf&&state.page<state.pdf.numPages){state.page++;render()}};document.getElementById('minus').onclick=()=>{state.scale=Math.max(.5,state.scale-.1);render()};document.getElementById('plus').onclick=()=>{state.scale=Math.min(3,state.scale+.1);render()};
</script>
</body>
</html>
